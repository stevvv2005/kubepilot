apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kubepilot-require-run-as-non-root
  labels:
    app.kubernetes.io/part-of: kubepilot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: KubePilot Security, Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      Reports Linux Pods unless runAsNonRoot is true at Pod level or on every
      application, init, and ephemeral container.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - argocd
            - monitoring
            - kyverno
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: only-linux-pods
      expression: >-
        !has(object.spec.os) || object.spec.os.name == 'linux'
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        (object.spec.?securityContext.?runAsNonRoot.orValue(false) == true &&
          variables.allContainers.all(container,
            container.?securityContext.?runAsNonRoot.orValue(true) == true)) ||
        variables.allContainers.all(container,
          container.?securityContext.?runAsNonRoot.orValue(false) == true)
      message: >-
        Linux containers must set runAsNonRoot to true at Pod level or on
        every application, init, and ephemeral container.
