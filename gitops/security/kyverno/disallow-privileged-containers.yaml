apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kubepilot-disallow-privileged-containers
  labels:
    app.kubernetes.io/part-of: kubepilot
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: KubePilot Security, Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      Reports application, init, or ephemeral containers that request
      privileged mode.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - argocd
            - monitoring
            - kyverno
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?privileged.orValue(false) == false)
      message: >-
        Privileged mode is disallowed. The privileged field must be unset or
        false for application, init, and ephemeral containers.
