apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kubepilot-disallow-privilege-escalation
  labels:
    app.kubernetes.io/part-of: kubepilot
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: KubePilot Security, Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      Reports Linux containers unless allowPrivilegeEscalation is explicitly
      set to false.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - argocd
            - monitoring
            - kyverno
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: only-linux-pods
      expression: >-
        !has(object.spec.os) || object.spec.os.name == 'linux'
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: >-
        Linux application, init, and ephemeral containers must set
        allowPrivilegeEscalation to false.
