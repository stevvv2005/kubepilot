
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

mode: deployment

replicaCount: 1
mode: deployment

replicaCount: 1

presets:
  logsCollection:
    enabled: false

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null

  processors:
    batch: {}

  exporters:
    debug:
      verbosity: basic

  service:
    pipelines:
      logs: null

      metrics:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - debug

      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - debug

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

  jaeger-compact:
    enabled: false

  jaeger-thrift:
    enabled: false

  jaeger-grpc:
    enabled: false

  zipkin:
    enabled: false

  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

service:
  type: ClusterIP

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s
  extraLabels:
    release: kubepilot-monitoring

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

useGOMEMLIMIT: true