grafana:
  enabled: true
  defaultDashboardsEnabled: true

  service:
    type: ClusterIP

  persistence:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 6h

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

alertmanager:
  enabled: true

  config:
    route:
      receiver: default
      routes:
        - receiver: kubepilot-sre
          matchers:
            - alertname="KubePilotPodIncident"

    receivers:
      - name: default

      - name: kubepilot-sre
        webhook_configs:
          - url: http://host.docker.internal:8081/alerts
            send_resolved: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
