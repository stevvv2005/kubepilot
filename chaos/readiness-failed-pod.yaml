apiVersion: v1
kind: Pod
metadata:
  name: kubepilot-readiness-failed
  namespace: default
  labels:
    app: kubepilot-readiness-failed
spec:
  restartPolicy: Always
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /this-path-does-not-exist
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
