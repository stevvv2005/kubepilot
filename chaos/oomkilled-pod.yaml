apiVersion: v1
kind: Pod
metadata:
  name: kubepilot-oomkilled
  namespace: default
  labels:
    app: kubepilot-oomkilled
spec:
  restartPolicy: Always
  containers:
    - name: memory-hog
      image: python:3.14-alpine
      command:
        - python
        - -c
        - |
          data = []
          while True:
              data.append("x" * 1024 * 1024)
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "100m"
